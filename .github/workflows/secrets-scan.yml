name: Secrets Scan

# Scans the repo (including git history) for leaked credentials on
# every PR, plus a weekly sweep that catches anything that bypassed the
# PR gate (force-push, history rewrite, branch protection gap). The
# weekly cron is what actually defends the main branch over time — a
# push-to-main trigger would just re-scan the same content the PR
# gate already approved, since PRs land via squash-merge one at a time.
# Required in branch protection — a leak on a PR should block the merge.
# False positives can be allowlisted in .gitleaks.toml.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 6 * * 1"  # weekly Monday sweep

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the scan sees historical commits

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # GITLEAKS_LICENSE is only needed for orgs — public repos don't
          # require it. Leaving it unset on the action lets the OSS edition run.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action defaults to a hardcoded 8.24.3 (its source comment
          # claiming "latest" is stale). 8.24.3 predates `targetRules`, which
          # .gitleaks.toml relies on to scope the entropy-based
          # generic-api-key rule off test modules — and it ignores unknown
          # allowlist keys *silently*, so the config would look applied while
          # the weekly sweep kept failing. Pinned rather than "latest" so a new
          # upstream release can't change the result of a scheduled scan.
          GITLEAKS_VERSION: "8.30.1"
        with:
          config-path: .gitleaks.toml
